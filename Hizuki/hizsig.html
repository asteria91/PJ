<style>
    @font-face {
        font-family: 'Galins';
        src: url("https://cdn.jsdelivr.net/gh/asteria91/Ilyana@main/Galins.otf");
        font-weight: bold;
    }
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0a0f;
        font-family: 'Noto Serif SC', 'Ma Shan Zheng', serif;
        padding: 20px;
    }

    /* ─── 500×300 ─── */
    .signature-card {
        position: relative;
        width: 500px;
        height: 300px;
        flex-shrink: 0;
        background:
            linear-gradient(145deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.85) 100%),
            url('https://raw.githubusercontent.com/asteria91/PJ/refs/heads/main/Hizuki/Hizu%20signature1.png');
        background-size: cover;
        background-position: center;
        padding: 18px 20px 14px;
        border: 1px solid rgba(200, 180, 255, 0.08);
        overflow: hidden;
        transition: box-shadow 0.5s ease, border-color 0.5s ease;
    }

    .signature-card:hover {
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.05), inset 0 0 80px rgba(200, 180, 255, 0.08);
    }

    /* ─── mist layer ─── */
    .mist-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
        border-radius: inherit;
    }

    .mist {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.36) 0%, transparent 70%);
        filter: blur(40px);
        animation: floatMist 18s ease-in-out infinite alternate;
    }

    .mist-1 {
        width: 300px;
        height: 180px;
        top: -40px;
        left: -60px;
        animation-duration: 22s;
    }
    .mist-2 {
        width: 350px;
        height: 200px;
        bottom: -60px;
        right: -80px;
        animation-duration: 26s;
        animation-delay: -4s;
    }
    .mist-3 {
        width: 250px;
        height: 150px;
        top: 10%;
        left: 20%;
        animation-duration: 20s;
        animation-delay: -10s;
    }

    @keyframes floatMist {
        0% {
            transform: translate(0, 0) scale(1) rotate(0deg);
            opacity: 0.3;
        }
        33% {
            transform: translate(30px, -15px) scale(1.1) rotate(2deg);
            opacity: 0.7;
        }
        66% {
            transform: translate(-15px, 20px) scale(0.9) rotate(-3deg);
            opacity: 0.4;
        }
        100% {
            transform: translate(20px, -8px) scale(1.05) rotate(1deg);
            opacity: 0.6;
        }
    }

    /* ─── particles ─── */
    .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
        border-radius: inherit;
    }

    .particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 240, 200, 0.5);
        box-shadow: 0 0 10px rgba(255, 220, 180, 0.8);
        animation: twinkle 6s ease-in-out infinite alternate;
    }

    .particle:nth-child(1) {
        top: 15%;
        left: 10%;
        width: 2px;
        height: 3px;
        animation-delay: 0.2s;
    }
    .particle:nth-child(2) {
        top: 20%;
        right: 8%;
        width: 1px;
        height: 4px;
        animation-delay: 1.8s;
    }
    .particle:nth-child(3) {
        bottom: 25%;
        left: 8%;
        width: 2px;
        height: 3px;
        animation-delay: 3.6s;
    }
    .particle:nth-child(4) {
        bottom: 15%;
        right: 12%;
        width: 1px;
        height: 4px;
        animation-delay: 5.1s;
    }
    .particle:nth-child(5) {
        top: 45%;
        left: 45%;
        width: 2px;
        height: 5px;
        animation-delay: 0.9s;
        opacity: 0.3;
    }

    @keyframes twinkle {
        0% {
            opacity: 0.1;
            transform: scale(0.8);
        }
        100% {
            opacity: 0.6;
            transform: scale(1.3);
        }
    }

    /* ─── card content ─── */
    .card-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 100%;
    }

    /* ─── corner stars ─── */
    .corner-star {
        position: absolute;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        pointer-events: none;
        transition: color 0.4s ease, text-shadow 0.4s ease;
        z-index: 2;
        font-weight: 300;
    }
    .signature-card:hover .corner-star {
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 0 30px rgba(200, 180, 255, 0.12);
    }
    .corner-star.tl {
        top: 12px;
        left: 16px;
    }
    .corner-star.tr {
        top: 12px;
        right: 16px;
    }
    .corner-star.bl {
        bottom: 12px;
        left: 16px;
    }
    .corner-star.br {
        bottom: 12px;
        right: 16px;
    }

    /* ─── side text ─── */
    .side-text {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        writing-mode: vertical-rl;
        letter-spacing: 5px;
        font-family: "Lora", serif;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.28);
        text-shadow: 0 0 30px rgba(200, 180, 255, 0.02);
        pointer-events: none;
        transition: color 0.6s ease, text-shadow 0.6s ease;
        z-index: 1;
        line-height: 1.6;
        text-orientation: upright;
    }
    .signature-card:hover .side-text {
        color: rgba(255, 255, 255, 0.15);
        text-shadow: 0 0 40px rgba(200, 180, 255, 0.04);
    }
    .side-text.left {
        left: 10px;
    }
    .side-text.right {
        right: 10px;
    }

    /* ─── ornaments ─── */
    .ornament-top {
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0.15;
        margin-bottom: 2px;
    }
    .ornament-top .line {
        width: 100px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
    }
    .ornament-top .diamond-small {
        width: 5px;
        height: 5px;
        transform: rotate(45deg);
        background: rgba(255, 255, 255, 1);
        border: 1px solid rgba(200, 180, 255, 0.06);
    }

    /* ─── 标题 PITCH-DARK ─── */
    .pitch-title {
        position: absolute;
        top: 182px;
        left: 0;
        width: 100%;
        text-align: center;
        font-family: 'Galins', serif;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: 4px;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.7), 0 2px 10px rgba(0, 0, 0, 0.5);
        text-transform: uppercase;
        transition: color 0.5s ease, letter-spacing 0.5s ease;
        user-select: none;
        z-index: 6;
        pointer-events: none;
        line-height: 1.2;
    }
    .signature-card:hover .pitch-title {
        color: rgba(222, 83, 85, 0.4);
        letter-spacing: 10px;
    }

    /* ─── 角色区域 + 菱形装饰 ─── */
    .character-area {
        position: relative;
        width: 250px;
        height: 250px;
        flex-shrink: 0;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .diamond-frame {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .diamond-frame::before {
        content: '';
        position: absolute;
        inset: -10px;
        border: 1px solid rgba(200, 180, 255, 0.08);
        transform: rotate(45deg);
        transition: border-color 0.5s ease, box-shadow 0.5s ease;
        pointer-events: none;
    }
    .signature-card:hover .diamond-frame::before {
        border-color: rgba(200, 180, 255, 0.15);

    }

    .diamond-frame::after {
        content: '◆';
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: rgba(200, 180, 255, 0.08);
        text-shadow: 0 0 20px rgba(200, 180, 255, 0.05);
    }

    .character-image-wrap {
        position: absolute;
        inset: 0;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .character-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.6s ease, filter 0.6s ease, box-shadow 0.6s ease;
        filter: saturate(1.05) contrast(1.02);
        display: block;
    }
    .signature-card:hover .character-image {
        transform: scale(1.02);
        filter: saturate(1.1) contrast(1.05) brightness(1.04);
    }

    .character-placeholder {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background: radial-gradient(ellipse at 50% 40%, #2a2740, #14121e);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(200, 180, 255, 0.08);
        font-size: 24px;
        font-family: 'Ma Shan Zheng', serif;
        letter-spacing: 4px;
        user-select: none;
    }

    /* ─── 底部装饰 ─── */
    .footer-ornament {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 2px;
        opacity: 0.08;
    }
    .footer-ornament .dot {
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(200, 180, 255, 0.2);
    }
    .footer-ornament .line-short {
        width: 20px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(200, 180, 255, 0.15), transparent);
    }

    /* ─── ✦ MUSIC CONTROL — TOP-RIGHT CORNER ✦ ─── */
    .music-control {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 10;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(200, 180, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .music-control:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(200, 180, 255, 0.3);
        transform: scale(1.05);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6), 0 0 30px rgba(200, 180, 255, 0.04);
    }

    .music-control:active {
        transform: scale(0.92);
    }

    .music-control button {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        width: 100%;
        height: 100%;
        transition: color 0.3s ease;
        outline: none;
        user-select: none;
    }

    .music-control button:hover {
        color: rgba(255, 255, 255, 0.98);
    }

    .music-control button i {
        display: block;
        line-height: 1;
        font-size: 14px;
        /* ensure icon is crisp */
        text-shadow: 0 0 12px rgba(200, 180, 255, 0.1);
    }

    /* hide the default audio element */
    #p {
        display: none;
    }

    /* ─── remove the old .pill ─── */
    .pill {
        display: none;
    }
</style>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><div class="signature-card">

    <!-- mist -->
    <div class="mist-layer" aria-hidden="true">
        <div class="mist mist-1"></div>
        <div class="mist mist-2"></div>
        <div class="mist mist-3"></div>
    </div>

    <!-- particles -->
    <div class="particles" aria-hidden="true">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- corner stars (top-right removed — music control takes its place) -->
    <span class="corner-star tl">&#10052;</span>
    <!-- .tr removed -->
    <span class="corner-star bl">&#10052;</span>
    <span class="corner-star br">&#10052;</span>

    <div class="side-text left">snowy</div>
    <div class="side-text right">will</div>

    <!-- ─── MUSIC CONTROL (top-right) ─── -->
    <div class="music-control" id="musicControl">
        <audio id="p" src="https://github.com/asteria91/PJ/raw/refs/heads/main/Hizuki/When_snow_melts_into_spring.mp3"></audio>
        <button id="b" aria-label="Play / Pause">
            <i class="fas fa-play"></i>
        </button>
    </div>

    <!-- card content -->
    <div class="card-content">

        <div class="ornament-top" aria-hidden="true">
            <span class="line"></span>
            <span class="diamond-small"></span>
            <span class="line"></span>
        </div>

        <div class="character-area">
            <div class="diamond-frame">
                <div class="character-image-wrap">
                    <img class="character-image" src="https://raw.githubusercontent.com/asteria91/PJ/refs/heads/main/Hizuki/Hizu%20signature2.png" alt="Hizuki" loading="lazy"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                    <div class="character-placeholder" style="display:none;">
                        <span>華</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="pitch-title">Hizuki</div>

        <div class="footer-ornament" aria-hidden="true">
            <span class="line-short"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="line-short"></span>
        </div>

    </div>
    <!-- /card-content -->

</div>

<script>
    (function() {
        const p = document.getElementById('p');
        const b = document.getElementById('b');

        b.onclick = function(e) {
            e.stopPropagation();
            if (p.paused) {
                p.play().catch(function(err) {
                    // Auto-play may be blocked; user gesture already handled
                    console.warn('Playback error:', err);
                });
                b.innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                p.pause();
                b.innerHTML = '<i class="fas fa-play"></i>';
            }
        };

        p.onended = function() {
            b.innerHTML = '<i class="fas fa-play"></i>';
        };

        // If audio fails to load, still show play icon
        p.onerror = function() {
            b.innerHTML = '<i class="fas fa-play"></i>';
        };
    })();
</script>
